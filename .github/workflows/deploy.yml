name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy backend
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"             "http://localhost:8000/api/v1/deploy?uuid=pskswsc8c0044ggo40go4og0"
      - name: Deploy frontend
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"             "http://localhost:8000/api/v1/deploy?uuid=f080ossg88ows8k8csw40c4s"
